services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smartgrid_timescaledb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yash9477
      POSTGRES_DB: smart_grid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smartgrid_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: smartgrid_api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery_worker:
    build: .
    container_name: smartgrid_celery_worker
    restart: always
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=info

  celery_beat:
    build: .
    container_name: smartgrid_celery_beat
    restart: always
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery beat --loglevel=info

volumes:
  postgres_data: