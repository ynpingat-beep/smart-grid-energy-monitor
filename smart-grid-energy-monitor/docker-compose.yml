version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: smartgrid_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yash9477
      POSTGRES_DB: smart_grid_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: smartgrid_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: smartgrid_api
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"