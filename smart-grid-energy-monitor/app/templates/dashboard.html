<!DOCTYPE html>
<html>

<head>

<title>Smart Grid Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="header">

⚡ Smart Grid Energy Monitoring System

</div>

<div class="container">

<div class="cards">

<div class="card blue">
<h2>Total Sensors</h2>
<p id="sensors">0</p>
</div>

<div class="card green">
<h2>Active Sensors</h2>
<p id="active">0</p>
</div>

<div class="card orange">
<h2>Total Readings</h2>
<p id="readings">0</p>
</div>

<div class="card purple">
<h2>Average Voltage</h2>
<p id="voltage">0</p>
</div>

<div class="card red">
<h2>Total Energy</h2>
<p id="energy">0</p>
</div>

</div>

<div class="section">

<h2>Recent Sensors</h2>

<table>

<tr>

<th>ID</th>
<th>Sensor</th>
<th>Status</th>
<th>Location</th>

</tr>

<tr>

<td>1</td>
<td>Main Meter</td>
<td>🟢 Active</td>
<td>Mumbai</td>

</tr>

</table>

</div>

<div class="section">

<h2>Voltage Trend</h2>

<p style="text-align:center;padding:40px;">
📈 Chart will be added in Week 2
</p>

</div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
